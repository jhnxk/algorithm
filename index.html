<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알고리즘 움직임 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* VOICE: 시험 직전 손에 쥐는 시간표처럼 단정하고 빠르게
   IDEA: 스위스 철도 시간표 — 단계(정류장)를 한 칸씩 넘기는 플레이어
   PICTURE: 알고리즘이 실제로 움직이는 무대(배열·격자·그래프)가 화면의 주인공
   COLOUR and TYPE: 흰 바탕·검정·신호 빨강, 보조 파랑 / Archivo + Noto Sans KR
   LAYOUT: 굵은 상단 괘선, 왼쪽 큰 번호, 패턴 칩 줄, 무대 → 설명 → 코드 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#f2f2f2);--mute:light-dark(#5f5f5f,#a3a3a3);--line:light-dark(#d2d2d2,#3a3a3a);--card:light-dark(#fff,#171717);--red:light-dark(#e4002b,#ff3b5c);--redt:light-dark(#fde2e7,#3d121b);--blue:light-dark(#1f5fd6,#7aa5ff);--bluet:light-dark(#dde8fb,#172747);--grey:light-dark(#ececec,#272727);--wt:light-dark(#ecd8b8,#4a3a20);--soft:light-dark(#f5f5f5,#151515)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{border-top:10px solid var(--ink);padding-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font:800 clamp(32px,6vw,52px)/1.05 Archivo,"Noto Sans KR",sans-serif;font-stretch:112%;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 b{color:var(--red)}
.sub{color:var(--mute);margin:8px 0 0}
.prog{min-width:200px;flex:0 1 280px}
.prog .lab{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.bar{height:8px;background:var(--grey);margin-top:6px}.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px max(5vw,16px);scrollbar-width:thin}
.grp{flex:none;align-self:center;font-size:13px;font-weight:900;color:var(--red);padding:0 4px 0 10px}
.grp:first-child{padding-left:0}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 14px;min-height:40px;font:700 14px "Noto Sans KR",sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.dn::after{content:" ✓";color:var(--red)}
.chip:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start}
.head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:end;grid-column:1/-1}
.num{font:800 clamp(48px,9vw,88px)/.85 Archivo,sans-serif;font-stretch:112%;color:var(--red);grid-row:span 2}
h2{font:900 clamp(26px,4vw,38px)/1.1 "Noto Sans KR",sans-serif;margin:0}
h2 small{font:500 15px Archivo,sans-serif;color:var(--mute);margin-left:8px}
.one{margin:0;font-weight:700;font-size:17px}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.vars button{min-height:40px;padding:0 14px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font:700 14px "Noto Sans KR",sans-serif;cursor:pointer}
.vars button.on{background:var(--red);border-color:var(--red);color:#fff}
.stage{container-type:inline-size;border:2px solid var(--ink);background:var(--soft);padding:16px;min-height:260px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.row .rl{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.cells{display:flex;gap:4px;flex-wrap:wrap}
.cw{display:flex;flex-direction:column;align-items:center}
.cell{width:min(46px,calc((100cqw - 4px * (var(--n) - 1)) / var(--n)));aspect-ratio:1;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:5px;font:800 clamp(12px,3.6cqw,17px) Archivo,"Noto Sans KR",sans-serif;transition:background .2s,color .2s}
.cell.wd{width:auto;aspect-ratio:auto;min-width:min(46px,calc((100cqw - 4px * (var(--n) - 1)) / var(--n)));height:min(46px,calc((100cqw - 4px * (var(--n) - 1)) / var(--n)));padding:0 8px;white-space:nowrap}
.tg{height:15px;font:800 11px Archivo,sans-serif;color:var(--red);white-space:nowrap}
.empty{font-size:13px;color:var(--mute);padding:8px 0}
.hl{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.in{background:var(--bluet);border-color:var(--blue)}
.alt{background:var(--grey);border-style:dashed}
.pv{border:3px solid var(--red)}
.dim{opacity:.28}
.bad{background:var(--redt);color:var(--red);border-color:var(--red)}
.wall{background:var(--mute);border-color:var(--mute)}
.wt{background:var(--wt)}
.wt.in{background:linear-gradient(135deg,var(--wt) 50%,var(--bluet) 50%)}
.path{background:var(--red);color:#fff;border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(var(--n),auto);gap:3px;justify-content:center}
.grid .cell{width:min(44px,calc((100cqw - 3px * (var(--n) - 1)) / var(--n)));border-radius:3px}
svg.g{width:100%;max-height:280px;display:block}
.g line,.g path.e{stroke:var(--line);stroke-width:2.5;fill:none}
.g .e-ok line{stroke:var(--ink);stroke-width:4}.g .e-ok polygon{fill:var(--ink)}
.g .e-hl line{stroke:var(--red);stroke-width:4.5}.g .e-hl polygon{fill:var(--red)}
.g .e-dim{opacity:.18}.g .e-bad line{stroke:var(--red);stroke-dasharray:5 5;opacity:.7}
.g polygon{fill:var(--line)}
.g .wb{fill:var(--soft)}.g .wl{font:800 13px Archivo,sans-serif;fill:var(--ink)}
.g circle{fill:var(--card);stroke:var(--ink);stroke-width:2}
.g .nt{font:800 15px Archivo,sans-serif;fill:var(--ink)}
.g .n-hl circle{fill:var(--red);stroke:var(--red)}.g .n-hl .nt{fill:#fff}
.g .n-ok circle{fill:var(--ink)}.g .n-ok .nt{fill:var(--bg)}
.g .n-in circle{fill:var(--bluet);stroke:var(--blue)}
.g .n-dim{opacity:.3}
.g .sl{font:800 12px Archivo,"Noto Sans KR",sans-serif;fill:var(--red)}
.bars{display:flex;flex-direction:column;gap:8px}
.track{position:relative;height:24px;margin:3px 0}
.iv{position:absolute;top:0;height:100%;border-radius:4px;border:1.5px solid var(--ink);background:var(--card);font:800 12px Archivo,sans-serif;display:grid;place-items:center;white-space:nowrap;overflow:hidden}
.axis{position:relative;height:16px;border-top:1.5px solid var(--ink);font:700 11px Archivo,sans-serif;color:var(--mute)}
.axis span{position:absolute;transform:translateX(-50%);top:2px}
.msg{border-left:6px solid var(--red);padding:10px 14px;margin:12px 0;background:var(--card);font-weight:700;min-height:3.2em}
.ctl{display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;gap:8px;align-items:center}
.ctl button,.act button{min-height:44px;min-width:44px;padding:0 14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:800 15px "Noto Sans KR",sans-serif;cursor:pointer}
.ctl #play{background:var(--ink);color:var(--bg)}
.ctl input{width:100%;accent-color:var(--red);height:44px}
.cnt{font:800 14px Archivo,sans-serif;white-space:nowrap}
.info dl{margin:0;display:grid;grid-template-columns:5.5em minmax(0,1fr);border-top:2px solid var(--ink)}
.info dt,.info dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.info dt{font-weight:900;color:var(--red);font-size:14px;padding-top:12px}
details{margin-top:16px;border:1.5px solid var(--line)}
summary{cursor:pointer;padding:12px 14px;font-weight:900;min-height:44px;display:flex;justify-content:space-between;align-items:center}
.cbar{display:flex;justify-content:flex-end;padding:0 10px}
.cbar button{min-height:36px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 13px "Noto Sans KR",sans-serif;padding:0 12px;cursor:pointer}
pre{overflow-x:auto;margin:0;padding:12px 14px 16px;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--soft)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.act #got{background:var(--red);border-color:var(--red);color:#fff;flex:1 1 200px}
.act #got.dn{background:var(--card);color:var(--red)}
.act #nx{flex:1 1 120px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend .l1::before{background:var(--red);border-color:var(--red)}.legend .l2::before{background:var(--ink);border-color:var(--ink)}.legend .l3::before{background:var(--bluet);border-color:var(--blue)}.legend .l4::before{background:var(--grey);border-style:dashed}
footer{color:var(--mute);font-size:13px;border-top:2px solid var(--ink)}
@media(max-width:860px){main .wrap{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.ctl{grid-template-columns:auto auto auto minmax(0,1fr)}.ctl .cnt{grid-column:1/-1;order:-1}.stage{padding:12px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band"><div class="wrap top">
  <div><h1>알고리즘 <b>25</b> 패턴,<br>움직임으로 이해하기</h1>
  <p class="sub">정렬 · 배열 · 자료구조 · 전략 · 그래프 — 한 단계씩 넘겨보고, 이해했으면 체크하고 다음으로.</p></div>
  <div class="prog"><div class="lab"><span>이해함</span><span id="pc">0 / 25</span></div><div class="bar"><i id="pb"></i></div></div>
</div></header>
<nav><div class="chips" id="chips"></div></nav>
<main class="band"><div class="wrap">
  <div class="head"><div class="num" id="num">01</div><h2 id="ttl"></h2><p class="one" id="one"></p></div>
  <section>
    <div class="vars" id="vars"></div>
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="legend"><span class="l1">지금 보는 것</span><span class="l2">확정·완료</span><span class="l3">범위·방문</span><span class="l4">대기 중</span></div>
    <div class="msg" id="msg"></div>
    <div class="ctl">
      <button id="prev" aria-label="이전 단계">◀</button>
      <button id="play">재생</button>
      <button id="next" aria-label="다음 단계">▶</button>
      <input type="range" id="rng" min="0" value="0" aria-label="단계 이동">
      <span class="cnt" id="cnt"></span>
    </div>
  </section>
  <section class="info">
    <dl><dt>언제 쓰나</dt><dd id="when"></dd><dt>복잡도</dt><dd id="cx"></dd><dt>시험 포인트</dt><dd id="tip"></dd></dl>
    <details open><summary>파이썬 코드</summary><div class="cbar"><button id="copy">복사</button></div><pre><code id="code"></code></pre></details>
    <div class="act"><button id="got">이해했어요 → 다음</button><button id="nx">건너뛰기</button></div>
  </section>
</div></main>
<footer class="band"><div class="wrap">키보드 ← → 로 단계 이동 · 체크 기록은 이 브라우저에만 저장돼요.</div></footer>
<script>
{
/* ---------- helpers ---------- */
const R=(l,vals,cf,tf)=>({l,cells:vals.map((v,k)=>({v,c:cf?cf(k,v):'',t:tf?tf(k,v):''}))});
const L=s=>String.fromCharCode(65+s);

/* ---------- graph presets ---------- */
const G7={A:[165,28],B:[90,92],C:[240,92],D:[40,165],E:[135,165],F:[205,165],G:[290,165]};
const G7E=[['A','B'],['A','C'],['B','D'],['B','E'],['C','F'],['E','F'],['C','G']];
const adj7={};for(const k in G7)adj7[k]=[];for(const[a,b]of G7E){adj7[a].push(b);adj7[b].push(a)}for(const k in adj7)adj7[k].sort();
const gnodes=(pos,cls,sub)=>Object.keys(pos).map(id=>({id,x:pos[id][0],y:pos[id][1],c:cls(id)||'',s:sub?sub(id):''}));

/* ---------- topics ---------- */
const T=[
/* ===== 정렬 ===== */
{id:'quick',g:'정렬',n:'퀵 정렬',en:'Quick Sort',one:'피벗 하나를 골라 작은 값은 왼쪽, 큰 값은 오른쪽으로 나눈 뒤 양쪽을 다시 정렬.',
when:'직접 정렬 구현, k번째 수 찾기(퀵 셀렉트), "분할 정복" 키워드.',cx:'평균 O(n log n) · 최악 O(n²) (이미 정렬된 배열 + 끝 피벗) · 추가 메모리 O(log n)',
tip:'한 번 분할이 끝나면 피벗은 최종 위치에 고정된다. 불안정 정렬.',
code:`def quick_sort(a, lo, hi):
    if lo >= hi: return
    p, i = a[hi], lo - 1          # 맨 끝을 피벗으로
    for j in range(lo, hi):
        if a[j] < p:              # 피벗보다 작으면 왼쪽 그룹으로
            i += 1
            a[i], a[j] = a[j], a[i]
    a[i+1], a[hi] = a[hi], a[i+1] # 피벗 제자리 확정
    quick_sort(a, lo, i)
    quick_sort(a, i + 2, hi)`,
gen(){const a=[4,7,2,9,1,6,3,5],F=[],done=new Set();
 const S=(m,lo,hi,i,j,p)=>F.push({msg:m,rows:[R('배열',a,k=>done.has(k)?'ok':(k<lo||k>hi)?'dim':k===p?'pv':k===j?'hl':(k>=lo&&k<=i)?'in':'',k=>[k===i&&i>=lo?'i':'',k===j?'j':''].filter(Boolean).join(' '))]});
 S('정렬 전. 구간의 맨 끝 값을 피벗으로 잡고, 피벗보다 작은 값을 왼쪽(파란 그룹)으로 모읍니다.',0,7,-9,-9,-9);
 const rec=(lo,hi)=>{if(lo>hi)return;if(lo===hi){done.add(lo);S(`${lo}번 칸 하나만 남음 → 이미 정렬된 상태`,lo,hi,-9,-9,-9);return}
  const p=a[hi];let i=lo-1;S(`구간 ${lo}~${hi}, 피벗 = ${p} (빨간 테두리)`,lo,hi,i,-9,hi);
  for(let j=lo;j<hi;j++){if(a[j]<p){i++;[a[i],a[j]]=[a[j],a[i]];S(`${a[i]} < ${p} → 왼쪽 그룹 끝(i)으로 교환`,lo,hi,i,j,hi)}else S(`${a[j]} ≥ ${p} → 그대로 둠`,lo,hi,i,j,hi)}
  [a[i+1],a[hi]]=[a[hi],a[i+1]];done.add(i+1);S(`피벗 ${p}을 왼쪽 그룹 바로 뒤(${i+1}번)로 → 위치 확정!`,lo,hi,-9,-9,-9);
  rec(lo,i);rec(i+2,hi)};
 rec(0,7);S('정렬 완료! 피벗이 하나씩 제자리에 박히면서 끝났어요.',0,7,-9,-9,-9);return F}},

{id:'merge',g:'정렬',n:'병합 정렬',en:'Merge Sort',one:'반씩 쪼개 길이 1까지 내려간 뒤, 정렬된 두 묶음을 앞에서부터 비교하며 합친다.',
when:'항상 O(n log n)이 보장돼야 할 때, 안정 정렬이 필요할 때, 역순쌍(inversion) 세기.',cx:'항상 O(n log n) · 추가 메모리 O(n)',
tip:'핵심은 "정렬된 두 배열 합치기" — 두 포인터로 작은 쪽을 먼저 꺼낸다. 안정 정렬.',
code:`def merge_sort(a):
    if len(a) <= 1: return a
    m = len(a) // 2
    L, R = merge_sort(a[:m]), merge_sort(a[m:])
    out, i, j = [], 0, 0
    while i < len(L) and j < len(R):
        if L[i] <= R[j]: out.append(L[i]); i += 1   # <= 라서 안정
        else:            out.append(R[j]); j += 1
    return out + L[i:] + R[j:]`,
gen(){const a=[6,3,8,1,5,2,7,4],F=[];const S=(m,cf,ex)=>F.push({msg:m,rows:[R('배열',a,cf)].concat(ex||[])});
 S('정렬 전. 길이 1이 될 때까지 반씩 나눈 다음, 합치면서 정렬합니다.',()=>'');
 const rec=(lo,hi)=>{if(lo>=hi)return;const m=(lo+hi)>>1;rec(lo,m);rec(m+1,hi);
  const A=a.slice(lo,m+1),B=a.slice(m+1,hi+1),out=[];let i=0,j=0;const inA=k=>k>=lo&&k<=m,inB=k=>k>m&&k<=hi;
  const base=k=>inA(k)?'in':inB(k)?'alt':'dim';
  S(`왼쪽 [${A}] · 오른쪽 [${B}] — 각각 정렬된 상태. 이제 합칩니다.`,base,[R('병합 결과',[],()=>'')]);
  while(i<A.length&&j<B.length){const t=A[i]<=B[j];const pick=t?A[i]:B[j];out.push(pick);
   S(`${A[i]} vs ${B[j]} → 작은 ${pick}을 먼저 꺼냄`,k=>(k===lo+i||k===m+1+j)?'hl':base(k),[R('병합 결과',out,()=>'ok')]);t?i++:j++}
  if(i<A.length||j<B.length){while(i<A.length)out.push(A[i++]);while(j<B.length)out.push(B[j++]);S('한쪽이 바닥남 → 남은 값은 이미 정렬돼 있으니 그대로 붙임',base,[R('병합 결과',out,()=>'ok')])}
  for(let k=0;k<out.length;k++)a[lo+k]=out[k];
  S(`구간 ${lo}~${hi} 병합 완료`,k=>k>=lo&&k<=hi?'ok':'dim')};
 rec(0,7);S('정렬 완료!',()=>'ok');return F}},

{id:'insert',g:'정렬',n:'삽입 정렬',en:'Insertion Sort',one:'앞쪽 정렬된 부분에 새 값을 하나씩 꺼내 알맞은 자리에 끼워 넣는다.',
when:'데이터가 거의 정렬돼 있을 때, n이 작을 때. 카드 정리하는 방식 그대로.',cx:'평균·최악 O(n²) · 거의 정렬된 입력은 O(n)에 가까움',
tip:'"앞쪽은 항상 정렬됨"이 불변식. 큰 값을 한 칸씩 뒤로 밀고 빈자리에 넣는다. 안정 정렬.',
code:`def insertion_sort(a):
    for i in range(1, len(a)):
        key, j = a[i], i - 1
        while j >= 0 and a[j] > key:   # key보다 크면 한 칸 뒤로
            a[j+1] = a[j]
            j -= 1
        a[j+1] = key                   # 빈자리에 끼워 넣기`,
gen(){const a=[5,2,4,6,1,3],F=[];
 F.push({msg:'첫 칸 [5]는 혼자니까 이미 "정렬된 앞부분"입니다.',rows:[R('배열',a,k=>k===0?'ok':'')]});

{id:'count',g:'정렬',n:'계수 정렬',en:'Counting Sort',one:'값마다 몇 번 나왔는지 세고, 작은 값부터 개수만큼 출력한다. 비교를 아예 안 함.',

tip:'값 범위가 크면(예: 10⁹) 못 쓴다. "범위가 좁다" = 계수 정렬 신호.',
code:`def counting_sort(a, k):          # 값 범위 0..k

        out += [v] * cnt[v]            # 개수만큼 차례로 출력
    return out`,

{id:'two',g:'배열·탐색',n:'투 포인터',en:'Two Pointers',one:'정렬된 배열 양 끝에 포인터를 두고, 합이 작으면 L을, 크면 R을 안쪽으로 옮긴다.',
when:'정렬된 배열에서 합이 X인 쌍, 두 배열 병합, 중복 제거, 팰린드롬 검사.',cx:'O(n) (정렬 포함 시 O(n log n)) — 이중 for문 O(n²)을 대체',

code:`def pairs(a, target):            # a는 정렬된 상태
    l, r, res = 0, len(a) - 1, []
    while l < r:

        if s == target:
            res.append((a[l], a[r])); l += 1; r -= 1
        elif s < target: l += 1     # 더 키워야 함
        else:            r -= 1     # 더 줄여야 함
    return res`,

{id:'slide',g:'배열·탐색',n:'슬라이딩 윈도우',en:'Sliding Window',one:'고정 길이 구간을 한 칸씩 밀면서, 나간 값은 빼고 들어온 값만 더한다.',
when:'"연속된 k개", "길이 k 구간의 최대 합/평균", 조건 만족하는 최장·최단 부분 배열(가변 윈도우).',cx:'O(n) — 매번 다시 더하면 O(n·k)',

code:`def max_window(a, k):
    s = sum(a[:k]); best = s
    for i in range(k, len(a)):

        best = max(best, s)
    return best`,

{id:'bin',g:'배열·탐색',n:'이분 탐색',en:'Binary Search',one:'정렬된 범위의 가운데를 보고, 답이 없는 절반을 통째로 버린다.',
when:'정렬된 배열에서 찾기, "최솟값의 최댓값"·"조건을 만족하는 최소 x" (파라메트릭 서치), n이 10⁵ 이상.',cx:'O(log n) — 10억 개도 약 30번',

code:`def binary_search(a, x):
    lo, hi = 0, len(a) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if a[mid] == x: return mid
        if a[mid] < x: lo = mid + 1    # 오른쪽 절반만 남김
        else:          hi = mid - 1    # 왼쪽 절반만 남김
    return -1

i = bisect_left(a, x)`,

 S('전체 범위 lo=0 ~ hi=7에서 시작.',-1);

{id:'interval',g:'배열·탐색',n:'구간 병합',en:'Merge Intervals',one:'시작점 기준으로 정렬한 뒤, 직전 구간과 겹치면 끝을 늘리고 안 겹치면 새로 시작.',
when:'회의실 배정, 겹치는 일정 합치기, 선분 덮기, "총 길이" 구하기.',cx:'정렬 O(n log n) + 한 번 훑기 O(n)',
tip:'겹침 판정: 새 시작 ≤ 직전 끝. 끝은 max로 갱신(안에 쏙 들어가는 구간 주의).',
code:`def merge_intervals(iv):
    iv.sort()                        # 시작점 기준 정렬
    out = [iv[0]]
    for s, e in iv[1:]:

            out[-1][1] = max(out[-1][1], e)
        else:
            out.append([s, e])
    return out`,

 const S=(m,cur)=>F.push({msg:m,bars:{max:mx,lanes:[{l:'입력 (시작점 정렬됨)',stack:true,items:iv.map((x,k)=>({a:x[0],b:x[1],c:k===cur?'hl':k<cur?'ok':''}))},{l:'병합 결과',items:out.map((x,k)=>({a:x[0],b:x[1],c:k===out.length-1&&cur<iv.length?'in':'ok'}))}]}});
 S('구간들을 시작점 순으로 정렬해 둡니다.',-1);
 iv.forEach(([s,e],k)=>{if(!out.length){out.push([s,e]);S(`첫 구간 [${s},${e}] 을 결과에 넣음`,k);return}const last=out[out.length-1];

{id:'mono',g:'자료구조',n:'모노톤 스택',en:'Monotonic Stack',one:'스택을 항상 내림차순(또는 오름차순)으로 유지. 규칙을 깨는 값이 오면 pop하며 답을 확정.',
when:'"오른쪽에서 처음 나오는 더 큰 수"(오큰수), 주식 가격, 온도가 오르기까지 며칠, 히스토그램 최대 직사각형.',cx:'O(n) — 각 원소가 한 번 push, 한 번 pop',
tip:'스택에는 값이 아니라 인덱스를 넣는 게 보통. pop되는 순간 = 그 원소의 답이 정해지는 순간.',
code:`def next_greater(a):
    ans, st = [-1] * len(a), []      # st: 인덱스 (값은 내림차순 유지)
    for i, x in enumerate(a):
        while st and a[st[-1]] < x:  # x가 더 크면 → 그들의 답은 x
            ans[st.pop()] = x
        st.append(i)

{id:'snail',g:'자료구조',n:'2차원 배열 순회',en:'2D Grid · Spiral',one:'방향 배열(dr, dc)로 이동하다가, 벽이나 이미 채운 칸을 만나면 방향을 바꾼다.',

code:`def snail(n):
    g = [[0] * n for _ in range(n)]
    dr, dc = [0, 1, 0, -1], [1, 0, -1, 0]   # → ↓ ← ↑
    r = c = d = 0
    for v in range(1, n * n + 1):

        nr, nc = r + dr[d], c + dc[d]

            d = (d + 1) % 4                  # 막히면 시계 방향 회전

        r, c = nr, nc
    return g`,

{id:'back',g:'전략',n:'백트래킹',en:'Backtracking',one:'한 칸씩 선택을 쌓아가다 조건이 깨지면 바로 되돌아가(가지치기) 다른 선택을 시도.',
when:'N-Queen, 순열·조합 만들기, 스도쿠, 부분집합, "모든 경우 중 조건 만족" + n이 작음(≤ 10~15).',cx:'최악 지수 시간 — 가지치기로 실제 탐색량을 줄이는 게 핵심',
tip:'선택 → 재귀 → 선택 취소(pop) 3단 구조. 조건 검사를 재귀 들어가기 "전"에 해야 빠르다.',
code:`def n_queen(n):
    cols, res = [], []                 # cols[r] = r행 퀸의 열
    def ok(r, c):
        return all(c != pc and abs(c - pc) != r - pr
                   for pr, pc in enumerate(cols))
    def go(r):
        if r == n: res.append(cols[:]); return
        for c in range(n):
            if ok(r, c):
                cols.append(c)         # 선택
                go(r + 1)              # 다음 행
                cols.pop()             # 되돌리기
    go(0)
    return res`,

def dijkstra(s):
    dist = {v: float('inf') for v in graph}

    pq = [(0, s)]
    while pq:
        d, u = heapq.heappop(pq)       # 가장 가까운 노드
        if d > dist[u]: continue       # 낡은 항목 무시

    cost = {s: 0}
    pq = [(h(s), s)]
    while pq:

{id:'topo',g:'그래프',n:'위상 정렬',en:'Topological Sort',one:'들어오는 화살표(진입 차수)가 0인 노드부터 꺼내고, 꺼낼 때마다 나가는 화살표를 지운다.',
when:'선수 과목, 작업 순서, 빌드 의존성 — "A를 해야 B를 할 수 있다" + 사이클 없는 방향 그래프(DAG).',cx:'O(V + E)',
tip:'결과 개수 < 노드 수 → 사이클이 있다는 뜻. 답이 여러 개일 수 있음(문제가 사전순 요구하면 heapq).',
code:`from collections import deque
def topo(n, edges):
    g = [[] for _ in range(n)]; indeg = [0] * n
    for a, b in edges:
        g[a].append(b); indeg[b] += 1
    q = deque(i for i in range(n) if indeg[i] == 0)
    order = []
    while q:
        u = q.popleft(); order.append(u)
        for v in g[u]:
            indeg[v] -= 1               # 화살표 지우기
            if indeg[v] == 0: q.append(v)
    return order                        # len < n 이면 사이클`,

code:`def kruskal(n, edges):              # edges: (w, a, b)
    parent = list(range(n))
    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]; x = parent[x]
        return x
    total = 0
    for w, a, b in sorted(edges):      # 가벼운 간선부터
        ra, rb = find(a), find(b)
        if ra != rb:                   # 사이클 안 생기면 채택
            parent[rb] = ra; total += w
    return total`,

const barsH=b=>{const pc=x=>x/b.max*100;const iv=it=>`<div class="iv ${it.c||''}" style="left:${pc(it.a)}%;width:${pc(it.b-it.a)}%">${it.a}–${it.b}</div>`;
 const ticks=[];for(let t=0;t<=b.max;t+=3)ticks.push(`<span style="left:${pc(t)}%">${t}</span>`);
 return`<div class="bars">${b.lanes.map(l=>`<div><div class="rl" style="font-size:13px;font-weight:700;color:var(--mute)">${l.l}</div>${l.stack?l.items.map(it=>`<div class="track">${iv(it)}</div>`).join(''):`<div class="track">${l.items.map(iv).join('')}</div>`}</div>`).join('')}<div class="axis">${ticks.join('')}</div></div>`};
const graphH=g=>{const N={};g.nodes.forEach(n=>N[n.id]=n);const r=17;
 const es=g.edges.map(e=>{const a=N[e.a],b=N[e.b];if(!a||!b)return'';const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
  const x1=a.x+ux*r,y1=a.y+uy*r,x2=b.x-ux*(r+(e.d?3:0)),y2=b.y-uy*(r+(e.d?3:0));
  const ar=e.d?`<polygon points="${x2},${y2} ${x2-ux*11-uy*6},${y2-uy*11+ux*6} ${x2-ux*11+uy*6},${y2-uy*11-ux*6}"/>`:'';
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const wl=e.w!=null?`<rect class="wb" x="${mx-11}" y="${my-10}" width="22" height="20" rx="4"/><text class="wl" x="${mx}" y="${my+5}" text-anchor="middle">${e.w}</text>`:'';
  return`<g class="${e.c?'e-'+e.c:''}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>${ar}${wl}</g>`}).join('');
 const ns=g.nodes.map(n=>`<g class="${n.c?'n-'+n.c:''}"><circle cx="${n.x}" cy="${n.y}" r="${r}"/><text class="nt" x="${n.x}" y="${n.y+5}" text-anchor="middle">${n.lab??n.id}</text>${n.s?`<text class="sl" x="${n.x}" y="${n.y+33}" text-anchor="middle">${n.s}</text>`:''}</g>`).join('');
 return`<svg class="g" viewBox="0 0 ${g.w||330} ${g.h||210}" role="img" aria-label="그래프">${es}${ns}</svg>`};

if(typeof document==='undefined'){globalThis.__T=T;globalThis.__H={rowH,gridH,barsH,graphH}}else{
/* ---------- app ---------- */
const $=id=>document.getElementById(id);
let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('algo25')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('algo25',JSON.stringify([...done]))}catch(e){}};
let cur=0,vi=0,F=[],fi=0,timer=null;
const pad=i=>String(i+1).padStart(2,'0');
const chips=()=>{let g='',h='';T.forEach((t,i)=>{if(t.g!==g){g=t.g;h+=`<span class="grp">${g}</span>`}h+=`<button class="chip${i===cur?' on':''}${done.has(t.id)?' dn':''}" data-i="${i}">${pad(i)} ${t.n}</button>`});$('chips').innerHTML=h;
 const on=$('chips').querySelector('.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
 $('pc').textContent=`${done.size} / ${NG}`;$('pb').style.width=done.size/NG*100+'%'};
const stop=()=>{clearInterval(timer);timer=null;$('play').textContent='재생'};
const draw=()=>{const f=F[fi];$('stage').innerHTML=(f.graph?graphH(f.graph):'')+(f.grid?gridH(f.grid):'')+(f.bars?barsH(f.bars):'')+(f.rows||[]).map(rowH).join('');
 $('msg').textContent=f.msg;$('cnt').textContent=`${fi+1} / ${F.length}`;$('rng').max=F.length-1;$('rng').value=fi};
const load=(i,v=0,push=true)=>{stop();cur=i;vi=v;const t=T[i];F=t.gen(v);fi=0;
 $('num').textContent=pad(i);$('ttl').innerHTML=`${t.n}<small>${t.en}</small>`;$('one').textContent=t.one;$('when').textContent=t.when;$('cx').textContent=t.cx;$('tip').textContent=t.tip;$('code').textContent=t.code;
 $('vars').innerHTML=t.vars?t.vars.map((x,k)=>`<button class="${k===v?'on':''}" data-v="${k}">${x}</button>`).join(''):'';
 const g=$('got');g.classList.toggle('dn',done.has(t.id));g.textContent=done.has(t.id)?'✓ 이해함 · 다음으로':'이해했어요 → 다음';
 chips();draw();if(push&&location.hash!=='#'+t.id)history.replaceState(null,'','#'+t.id)};
const go=d=>{fi=Math.max(0,Math.min(F.length-1,fi+d));draw()};
$('prev').onclick=()=>{stop();go(-1)};$('next').onclick=()=>{stop();go(1)};
$('play').onclick=()=>{if(timer){stop();return}if(fi>=F.length-1)fi=0,draw();$('play').textContent='정지';timer=setInterval(()=>{if(fi>=F.length-1){stop();return}go(1)},1100)};
$('rng').oninput=e=>{stop();fi=+e.target.value;draw()};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){load(+b.dataset.i);window.scrollTo({top:0,behavior:'smooth'})}};
$('vars').onclick=e=>{const b=e.target.closest('button');if(b)load(cur,+b.dataset.v)};
const nextT=()=>{if(cur<NG-1){load(cur+1);window.scrollTo({top:0,behavior:'smooth'})}};
$('got').onclick=()=>{done.add(T[cur].id);save();if(cur<NG-1)nextT();else load(cur,vi)};
$('nx').onclick=nextT;
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(T[cur].code);$('copy').textContent='복사됨'}catch(e){$('copy').textContent='직접 선택해 복사하세요'}setTimeout(()=>$('copy').textContent='복사',1500)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){stop();go(1)}if(e.key==='ArrowLeft'){stop();go(-1)}});
const fromHash=()=>{const i=T.findIndex(t=>'#'+t.id===location.hash);return i<0?0:i};
window.addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)load(i,0,false)});
load(fromHash(),0,false);
}
}
</script>
</body>
</html>
